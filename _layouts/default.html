<!doctype html>
<html lang="en" class="scroll-smooth">
  {% include head.html %}
  <body class="font-rajdhani text-lg scanline min-h-screen flex flex-col justify-between selection:bg-cyber-pink selection:text-white">
    {% include header.html %}
    <main class="container mx-auto px-4 md:px-6 py-8 md:py-12 max-w-5xl space-y-12 md:space-y-16">
      {{ content }}
    </main>
    {% include footer.html %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const glitchLinks = document.querySelectorAll('.glitch-link');

            function triggerRandomGlitch() {
                if (glitchLinks.length === 0) return;

                const randomLink = glitchLinks[Math.floor(Math.random() * glitchLinks.length)];
                randomLink.classList.add('is-glitching');

                setTimeout(() => {
                    randomLink.classList.remove('is-glitching');
                }, Math.random() * 220 + 280);

                setTimeout(triggerRandomGlitch, Math.random() * 900 + 500);
            }

            triggerRandomGlitch();
        });
    </script>
  </body>
</html>
